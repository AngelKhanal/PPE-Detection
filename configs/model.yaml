weights: models/trained/best.pt
conf: 0.25          # global floor passed to model
imgsz: 640
min_conf:           # applied after detection, per class
  helmet: 0.6
  boots: 0.4
  person: 0.5
  vest: 0.5
classes:
  0: helmet
  1: boots
  2: person    # whole-body box, labeled inconsistently in dataset; not used for rules
  3: vest

person:
  weights: yolo11n.pt
  conf: 0.4
required: [helmet, vest]
violation_frames: 15